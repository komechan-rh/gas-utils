name: ci

# 全パッケージ（各 automation と shared）の lint・フォーマット・型チェック・テスト・ビルドを検証する。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm のバージョンはルート package.json の packageManager を参照する
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and format check
        run: pnpm -r exec biome ci
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Test
        run: pnpm -r run test
      - name: Build
        run: pnpm -r run build
